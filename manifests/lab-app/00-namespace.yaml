apiVersion: v1
kind: Namespace
metadata:
  name: lab-app
  labels:
    app.kubernetes.io/part-of: kubernetes-security-foundations-lab
    phase: "03"
    # Pod Security Admission — Restricted (enforce + warn + audit)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
