# Dedicated identity for least-privilege read access in lab-app.
# Prefer this over the namespace "default" ServiceAccount for any real workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-reader
  namespace: lab-app
  labels:
    app.kubernetes.io/part-of: kubernetes-security-foundations-lab
    app.kubernetes.io/component: rbac
automountServiceAccountToken: true
